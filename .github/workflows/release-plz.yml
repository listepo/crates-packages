name: release-plz

# Every merge to main keeps one pull request up to date: the next version, and
# the changelog entry for it, both derived from the conventional commits since
# the last tag. Merging that pull request is the release — release.yml
# publishes to crates.io and only then creates the tag.
#
# Nothing here tags anything or publishes anywhere. Only `release-pr` is ever
# run: the tag and the crates.io publish are release.yml's to make, once there
# is something behind them.
#
# Answers both push-to-main and PR events. A push to main opens/updates the
# release PR against the base branch; a PR event lets this same update logic
# run from the head branch (where `release-plz-${{ github.ref }}` reads its own
# ref without privilege issues).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    # Two merges landing together must not race for the same release pull
    # request, and cancelling the first one halfway would leave it stale.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false

    # release-plz answers PR events too: the pending check is a read of main's
    # tag state, but `git ls-remote origin` needs no privilege and reads the
    # same refs from any branch. On a PR head the version in Cargo.toml is the
    # head's — the PR under repair — which is exactly what the check must see.
    # The default checkout on a PR event is the merge commit; full history is
    # still needed for the changelog, so keep fetch-depth 0 and check out the
    # head explicitly.
    steps:
      # A workflow run authenticated with the default GITHUB_TOKEN cannot start
      # another workflow run, so the release pull request it opens would land
      # on main without CI ever running on it — and merging that pull request
      # is what publishes to crates.io. Fail here, loudly, instead.
      #
      # See https://release-plz.dev/docs/github/token — a fine-grained PAT or a
      # GitHub App token with contents and pull-requests read/write.
      - name: A token that can trigger release.yml
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_PLZ_TOKEN is not set." >&2
            echo "The default GITHUB_TOKEN cannot trigger release.yml from a" >&2
            echo "pushed release pull request, so a release would be created with no checks." >&2
            echo "See https://release-plz.dev/docs/github/token" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # The changelog is built from the whole history, not one commit.
          fetch-depth: 0
          # On PR events check out the head, not the merge commit: the merge
          # ref is ephemeral and release-plz compares the branch itself.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      # A release pull request is written against the last released version, so
      # proposing one while a release is still being published would compare
      # against a tag that does not exist yet and bump from the wrong place.
      # The merge that starts a release therefore opens no pull request; the
      # next commit after it does, by which time the tag is there.
      - name: Is a release still being published?
        id: pending
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"name":"file-backup","version":"\([^"]*\)".*/\1/p')"
          if git ls-remote --exit-code --tags origin "refs/tags/file-backup-v$version" >/dev/null 2>&1; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "file-backup-v$version is not released yet; leaving the release pull request alone"
          fi

      - name: Open or update the release pull request
        if: steps.pending.outputs.pending == 'false'
        uses: release-plz/action@v0.5.136
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
