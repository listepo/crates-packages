name: publish

# crates.io publish runs only when a GitHub Release is published AND is not
# a draft. `types: [published]` already excludes draft creation (a draft
# becoming published fires `published`), and the job guard below makes the
# exclusion explicit: saving or updating a draft release publishes nothing.
on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    if: github.event.release.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Publish file-backup
        run: cargo publish -p file-backup --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
