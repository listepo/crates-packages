name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Publishing happens only from a non-draft GitHub Release (see
      # publish.yml). Every other push just proves the crates are
      # publish-ready, so a broken publish breaks here, not at release time.
      - name: Publish dry-run
        run: cargo publish --dry-run -p file-backup --locked

  # file-backup is std-only and shared by ketch and rtok on all three
  # platforms, so the unit tests run on each of them.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked
